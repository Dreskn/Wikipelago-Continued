<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#141d28" />
  <meta name="description" content="Play Wikipedia racing rounds connected to Archipelago." />
  <title>Wikipelago</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192_placeholder.png" />
  <link rel="stylesheet" href="/static/style.css?v=20260727-2" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar-brand">
        <h1>Wikipelago</h1>
        <div id="buildBadge" class="build-badge" title="Deploy build">…</div>
      </div>
      <div id="connBadge" class="badge offline">Offline</div>
    </header>

    <main class="main-grid">
      <section class="article-panel">
        <div id="articleTitle" class="article-title">Wikipedia</div>
        <div id="searchOverlay" class="search-overlay hidden">
          <div class="search-row">
            <input id="pageSearchInput" type="text" placeholder="Search this page" />
            <button id="closeSearchBtn" type="button">Close</button>
          </div>
          <div class="search-meta">
            <span id="searchStatus">Locked</span>
            <span id="searchLetters">Letters: -</span>
          </div>
        </div>
        <article id="articleBody" class="article-body"></article>
      </section>

      <aside class="side-panel">
        <div class="card">
          <h2>Connection</h2>
          <label>Server</label>
          <input id="serverInput" type="text" placeholder="archipelago.gg:PORT" />
          <label>Slot</label>
          <input id="slotInput" type="text" placeholder="WikiTester" />
          <label>Password</label>
          <input id="passwordInput" type="password" placeholder="(optional)" />
          <button id="connectBtn">Connect</button>
        </div>

        <div class="card">
          <h2>Run</h2>
          <div class="run-label-row">
            <strong>Rounds</strong>
            <span id="roundText" class="muted-meta">-</span>
          </div>
          <div id="roundsTrack" class="rounds-track" aria-label="Round progress"></div>

          <p class="target-row">
            <strong>Target:</strong>
            <span class="target-hover" id="targetHover">
              <span id="targetText">-</span>
              <span id="targetTooltip" class="target-tooltip hidden" role="tooltip"></span>
            </span>
            <button type="button" id="rerollTargetBtn" class="btn-quiet" disabled title="Reroll this round's target (up to 3 per round; not on Grand Goal)">Reroll</button>
            <span id="rerollTargetMeta" class="muted-meta"></span>
          </p>

          <div class="goal-block">
            <div id="fragmentsBlock">
              <div class="run-label-row">
                <strong>Fragments</strong>
                <span id="fragmentsText" class="muted-meta">0/0</span>
              </div>
              <div id="fragmentsTrack" class="fragments-track" aria-label="Knowledge fragments"></div>
            </div>
            <p id="goalRow" class="goal-row hidden">
              <strong>Grand Goal:</strong> <span id="goalText">-</span>
            </p>
          </div>

          <p><strong>Clicks:</strong> <span id="clicksText">0</span></p>
          <p><strong>Compass:</strong> <span id="compassHint">-</span></p>
          <div id="toast" class="toast hidden"></div>
        </div>

        <div id="bingoCard" class="card hidden">
          <h2>Letter Pair Bingo</h2>
          <div id="bingoGrid" class="bingo-grid" aria-label="Letter pair bingo"></div>
          <p id="bingoMeta" class="muted-meta"></p>
        </div>

        <div class="card">
          <h2>Items</h2>
          <div id="toolIconsRow" class="item-icon-row" aria-label="Tools"></div>
        </div>

        <div id="lensesCard" class="card hidden">
          <h2>Lenses</h2>
          <div id="lensIconsRow" class="item-icon-row" aria-label="Display lenses"></div>
          <span id="lensesItem" class="hidden"></span>
        </div>

        <div id="sanityCard" class="card hidden">
          <h2>Sanity unlocks</h2>
          <div id="scrollIconsRow" class="item-icon-row" aria-label="Scroll speed"></div>
          <div id="letterIconsRow" class="letter-row" aria-label="Search letters"></div>
        </div>

        <div id="difficultyCard" class="card hidden">
          <h2>Difficulty</h2>
          <div id="difficultyIconsRow" class="item-icon-row" aria-label="Difficulty options"></div>
        </div>

        <div class="helper-box">
          <button type="button" id="stuckToggleBtn" class="helper-toggle">Are you really stuck?</button>
          <div id="stuckPanel" class="helper-panel hidden">
            <p class="helper-line">
              Try the
              <a href="https://wiki.spaceface.dev/" target="_blank" rel="noopener noreferrer">Wiki path solver</a>
            </p>
            <p class="helper-line">
              Still stuck?
              <label class="helper-debug-label">
                <input type="checkbox" id="enableDebugMenuChk" />
                Enable AP debug menu
              </label>
            </p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/static/app.js?v=20260727-2"></script>
</body>
</html>
