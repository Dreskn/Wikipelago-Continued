name: Pool validate

# GitHub only fires `schedule` from the default branch (`main`). This file
# therefore needs to exist on `main` for the weekly run to start. The job
# always checks out `dev`, so it validates the 1.0 pools, not prod 0.6.
# Failures send the same Actions emails as any other CI job (if enabled).
# No --apply-removals: drifted titles are reported, not rewritten.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "world/APWorldSource/wikipelago/data/pool_*.json"
      - "world/validate_article_pool.py"
      - ".github/workflows/pool-validate.yml"

jobs:
  pool-validate:
    name: Pool validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate article pools against Wikipedia (all languages)
        run: python world/validate_article_pool.py --lang all --strict

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-validation-report
          path: world/pool_validation_report.json
          if-no-files-found: ignore
