# Player YAML template for Wikipelago.
# Copy this file into your Archipelago Players folder and change `name` if you need a different slot name.

name: MadWikiRacer
game: Wikipelago
description: Default Wikipelago player template

# Fail generation if the host Archipelago / Wikipelago apworld is too old for this
# template (avoids silent ignores of newer options like progressive tools).
# Archipelago only accepts dotted integers here (1.0.0), not 1.0-beta1.
requires:
  version: 0.6.7
  game:
    Wikipelago: 1.0.0

Wikipelago:

  # =============================================================================
  # Main game
  # =============================================================================
  # progression_balancing: Archipelago 0–99; higher tends to place useful progression a bit earlier in the item sphere.
  # check_count: how many Start → Target rounds (checks) are generated (10–999, default 40).
  # required_fragments / additional_fragments_in_pool: 1–200 / 0–200.
  # start_rounds_unlocked / rounds_per_unlock: early open rounds, then each Round Access unlocks this many more (1–999).
  # Grand Goal is always a closed question from that wiki language's goal pool
  # (answer page preferred from enabled categories).
  progression_balancing: 50
  check_count: 40
  required_fragments: 7
  additional_fragments_in_pool: 2
  start_rounds_unlocked: 10
  rounds_per_unlock: 5
  random_goal_article: true
  # Deprecated and ignored. Kept so older YAMLs still generate. The Grand Goal
  # always comes from the language goal pool, not this list.
  goal_article_preset: dark_souls

  # =============================================================================
  # Progressive tools — Back & target rerolls
  # =============================================================================
  # Each system has a starting value plus Progressive items in the pool.
  # back_depth_*: browser Back depth (per round; 0 = locked until Progressive Back).
  # target_reroll_*: target page rerolls available each round.
  # Ranges are 0–5 for all four options.
  back_depth_start: 0
  back_depth_unlocks: 3
  target_rerolls_start: 1
  target_reroll_unlocks: 2

  # =============================================================================
  # Letter-pair bingo
  # =============================================================================
  # Stamp letter pairs from page titles; row / col / diag / full checks per board.
  # Grid size N (3–20); default 5 → weighted sample from that wiki’s Scrabble letter pairs.
  # Letter pairs use Scrabble alphabets (e.g. pl keeps Ą/Ć/Ł…; fr folds é→E; de keeps Ä/Ö/Ü, ß→SS).
  # bingo_cards_start / bingo_card_unlocks: 0–20 each (combined boards capped at 40).
  # bingo_stamp_unlocks: Progressive Bingo Stamp items (each stamps one empty cell on one board, once per seed).
  # Bingo on with start 0 and unlocks 0 is rejected (no boards).
  toggle_bingo_letterpairs: true
  bingo_letterpairs_grid: 5
  bingo_cards_start: 1
  bingo_card_unlocks: 2
  bingo_stamp_unlocks: 2

  # =============================================================================
  # Crossroads & side branches
  # =============================================================================
  # Selected main-road rounds (never round 1) become crossroads.
  # Keys auto-spend on the earliest finished crossroad first: Branch N needs
  # N Branch Keys plus that completed crossroad (either order). All unlocked
  # branches stay live at once: every page visit can clear the main target
  # and/or a branch target (and still stamp bingo). Extra keys beyond
  # branch_count still count as progression but do not open more branches.
  # 0 disables the whole system.
  # branch_count: 0–8 (default 0). branch_length: 1–20 rounds per branch.
  # additional_branch_keys: 0–8 extra keys in the pool.
  branch_count: 0
  branch_length: 3
  additional_branch_keys: 0

  # =============================================================================
  # Wikipedia language & article pool
  # =============================================================================
  # wikipedia_language: native titles + page fetches for this slot.
  #   Valid: en | fr | de | es | it | pt | nl | sv | pl
  wikipedia_language: en
  # Categories use multi-tag OR: a title is kept if any of its tags intersects
  # an enabled category. Turn categories on/off to shape the round article pool.
  include_video_games: true
  include_movies: true
  include_tv_shows: true
  include_anime_manga: true
  include_sports: true
  include_science_space: true
  include_technology: true
  include_history: true
  include_geography: true
  include_food_cuisine: true
  include_art_literature: true
  include_mythology_folklore: true
  include_music: true
  include_politics: true
  include_famous_people: true
  include_animals: true
  include_biology_medicine: true
  include_miscellaneous: true
  # When false, sensitive pages (porn, terrorism, violent/sexual crime, illicit
  # drugs) are excluded even if they match an enabled category.
  include_sensitive_pages: false

  # =============================================================================
  # Sanities (off by default)
  # =============================================================================
  # searchsanity: Ctrl+F limited to unlocked Search Letter items.
  # search_starting_letters: starting letters when searchsanity is on
  #   (none | all_vowels | etaoi | raise).
  # scrollsanity: scrolling starts slow; needs Progressive Scroll Speed upgrades.
  searchsanity: false
  search_starting_letters: none
  scrollsanity: false

  # =============================================================================
  # Display lenses (off by default = normal Wikipedia look)
  # =============================================================================
  # When true, that page element stays hidden until its Lens item is received.
  # Enabling these (even individually) can make progression MUCH harder; stacking
  # several can increase difficulty exponentially or make progression impossible.
  randomize_tables: false
  randomize_pictures: false
  randomize_incipit: false
  randomize_infoboxes: false
  randomize_toc: false
  randomize_navboxes: false
  randomize_hatnotes: false
  randomize_references: false

  # =============================================================================
  # Deaths, DeathLink & link bombs (off by default = peaceful)
  # =============================================================================
  # deaths: revisiting a page already visited this round = death → random jump (local).
  # death_link: full Archipelago DeathLink (send and receive).
  # link_bombs: hidden bomb links on pages (requires deaths); hitting one = death.
  # link_bomb_density: few | more | insane (only when link_bombs is on).
  deaths: false
  death_link: false
  link_bombs: false
  link_bomb_density: few

  # =============================================================================
  # Traps
  # =============================================================================
  # trap_count: Foggy Links / Missing Links / Wrong Wiki items in the pool (0–99)
  # trap_type: both | only_foggy_links | only_missing_links | only_wrong_wiki
  # trap_link: share traps with other Trap Link players (independent of count).
  trap_count: 0
  trap_type: both
  trap_link: false
